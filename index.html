<div id="pano"></div>
<div class="brand"><b>بيتي 360°</b><span>رندر واقعي من رسمة على ورقة</span></div>
<div class="hint" id="hint">اسحب لتتطلّع حواليك · كبوس عالسهم لتنتقل</div>
<div class="styles" id="styles"></div>
<div class="rooms" id="rooms"></div>
<div class="tools">

  <button type="button" id="planbtn">📐 المخطط</button>
</div>
<div id="planbox" hidden>
  <div id="planscroll"><div id="planstage"><img id="planimg" src="plan.jpg" alt="المخطط الأصلي" draggable="false"><div id="me"><b></b><i></i></div></div></div>
  <div class="planbar"><button type="button" id="planclose" aria-label="سكّر">✕</button><button type="button" id="zin" aria-label="قرّب">+</button><button type="button" id="zout" aria-label="بعّد">−</button></div>

</div>

<script>
  // every panorama: image centre looks north; yaw grows clockwise (east 90, south 180, west -90)
  const ROOMS = {
    entrance: { name: 'المدخل', yaw: -10 },
    living: { name: 'الصالة', yaw: -121 },
    dining: { name: 'السفرة', yaw: 134 },
    kitchen: { name: 'المطبخ', yaw: 127 },
    master: { name: 'غرفة النوم', yaw: -10 },
  };
  const LINKS = {
    entrance: [['living', -11], ['dining', 15.5]],
    living: [['entrance', 132], ['dining', 55], ['master', 21]],
    dining: [['living', -76], ['entrance', -164], ['kitchen', 157]],
    kitchen: [['dining', -42]],
    master: [['living', 133]],
  };
  function arrow(div, label) {
    div.classList.add('go');
    const s = document.createElement('span');
    s.textContent = label;
    div.appendChild(s);
  }
  const STYLES = { warm: 'عصري دافي', classic: 'كلاسيكي', industrial: 'صناعي' };
  const scenes = {};
  for (const st of Object.keys(STYLES)) for (const [id, r] of Object.entries(ROOMS)) {
    scenes[st + '_' + id] = {
      type: 'equirectangular', panorama: 'pano/' + st + '_' + id + '.jpg', yaw: r.yaw, pitch: -6,
      hotSpots: LINKS[id].map(([to, yaw]) => ({ pitch: -24, yaw, type: 'scene', sceneId: st + '_' + to, targetYaw: ROOMS[to].yaw,
        createTooltipFunc: arrow, createTooltipArgs: ROOMS[to].name })),
    };
  }
  const tag = location.hash.slice(1);
  const first = scenes[tag] ? tag : 'warm_entrance';
  const viewer = pannellum.viewer('pano', {
    default: { firstScene: first, sceneFadeDuration: 350, autoLoad: true, showZoomCtrl: false, showFullscreenCtrl: false, compass: false, hfov: 100, minHfov: 50, maxHfov: 120 },
    scenes,
  });
  const bar = document.getElementById('rooms');
  for (const [id, r] of Object.entries(ROOMS)) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'room-' + id; b.textContent = r.name; b.dataset.id = id;
    b.onclick = () => viewer.loadScene(cur().st + '_' + id, 'same', r.yaw);
    bar.appendChild(b);
  }
  const cur = () => { const [st, ...rest] = viewer.getScene().split('_'); return { st, room: rest.join('_') }; };
  const sbar = document.getElementById('styles');
  for (const [st, name] of Object.entries(STYLES)) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'style-' + st; b.textContent = name; b.dataset.st = st;
    b.onclick = () => viewer.loadScene(st + '_' + cur().room, 'same', 'same');
    sbar.appendChild(b);
  }
  const mark = () => {
    const c = cur();
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === c.room));
    sbar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.st === c.st));
  };
  viewer.on('scenechange', () => setTimeout(mark, 0)); mark();
  // warm the cache: every panorama downloads in the background (same CORS mode as the viewer, so it is reused),
  // current style first, then the same room in the other styles, then the rest
  const kept = [];
  let preloaded = false;
  viewer.on('load', () => {
    if (preloaded) return;
    preloaded = true;
    const c = cur(), order = [];
    for (const id of Object.keys(ROOMS)) order.push(c.st + '_' + id);
    for (const st of Object.keys(STYLES)) order.push(st + '_' + c.room);
    for (const id of Object.keys(scenes)) order.push(id);
    const queue = [...new Set(order)].filter(id => id !== viewer.getScene());
    const next = () => {
      const id = queue.shift();
      if (!id) return;
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = im.onerror = () => { (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(next); };
      im.src = scenes[id].panorama;
      kept.push(im);
    };
    next(); next();
  });
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 7000);

  // ---------- interactive plan: pan / pinch / wheel zoom, room spots, "you are here"
  const planbox = document.getElementById('planbox'), stage = document.getElementById('planstage'), pimg = document.getElementById('planimg');
  const IMG_W = 2400, IMG_H = 2360; // original sketch pixels; house NW corner at (276, 350.4), 138 px per metre
  const SPOT = { entrance: [6.0, 10.4], living: [3.3, 6.2], dining: [7.3, 5.7], kitchen: [9.7, 9.85], master: [2.7, 2.95] };
  const pct = ([x, z]) => [(276 + x * 138) / IMG_W * 100, (350.4 + z * 138.3) / IMG_H * 100];
  for (const [id, pos] of Object.entries(SPOT)) {
    const [l, t] = pct(pos), d = document.createElement('div');
    d.className = 'spot'; d.dataset.id = id; d.style.left = l + '%'; d.style.top = t + '%';
    d.innerHTML = '<button type="button" aria-label="' + ROOMS[id].name + '"></button><span>' + ROOMS[id].name + '</span>';
    d.querySelector('button').addEventListener('click', ev => { ev.stopPropagation(); planbox.hidden = true; viewer.loadScene(cur().st + '_' + id, 'same', ROOMS[id].yaw); });
    stage.appendChild(d);
  }
  const scroller = document.getElementById('planscroll');
  let baseW = 300, sc = 1;
  function fit() {
    const W = scroller.clientWidth, H = scroller.clientHeight;
    baseW = Math.max(200, Math.min(W - 24, H * IMG_W / IMG_H));
    sc = 1; stage.style.width = baseW + 'px';
    stage.style.marginTop = Math.max(0, (H - baseW * IMG_H / IMG_W) / 2) + 'px';
  }
  function zoom(f) {
    const cx = (scroller.scrollLeft + scroller.clientWidth / 2) / (baseW * sc);
    const cy = (scroller.scrollTop + scroller.clientHeight / 2) / (baseW * sc * IMG_H / IMG_W);
    sc = Math.min(4, Math.max(1, sc * f));
    stage.style.width = baseW * sc + 'px';
    stage.style.marginTop = Math.max(0, (scroller.clientHeight - baseW * sc * IMG_H / IMG_W) / 2) + 'px';
    scroller.scrollLeft = cx * baseW * sc - scroller.clientWidth / 2;
    scroller.scrollTop = cy * baseW * sc * IMG_H / IMG_W - scroller.clientHeight / 2;
  }
  function markHere() {
    const c = cur();
    stage.querySelectorAll('.spot').forEach(d => d.classList.toggle('here', d.dataset.id === c.room));
    const [l, t] = pct(SPOT[c.room]), me = document.getElementById('me');
    me.style.left = l + '%'; me.style.top = t + '%';
    me.querySelector('b').style.transform = 'rotate(' + viewer.getYaw() + 'deg)';
  }
  document.getElementById('planbtn').onclick = () => { planbox.hidden = false; fit(); try { markHere(); } catch (e) {} };
  document.getElementById('planclose').onclick = () => { planbox.hidden = true; };
  document.getElementById('zin').onclick = () => zoom(1.6);
  document.getElementById('zout').onclick = () => zoom(1 / 1.6);
  scroller.addEventListener('wheel', e => { if (e.ctrlKey || Math.abs(e.deltaY) > 0) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15); } }, { passive: false });
  addEventListener('resize', () => { if (!planbox.hidden) fit(); });
  const gyro = document.getElementById('gyro');
  if (matchMedia('(pointer: coarse)').matches && window.DeviceOrientationEvent) {
    gyro.hidden = false;
    gyro.onclick = async () => {
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function' && (await DeviceOrientationEvent.requestPermission()) !== 'granted') return;
      } catch (e) { return; }
      if (viewer.isOrientationActive()) { viewer.stopOrientation(); gyro.textContent = '📱 لفّ الموبايل'; }
      else { viewer.startOrientation(); gyro.textContent = '✋ وقّف اللفّ'; }
    };
  }
</script>
